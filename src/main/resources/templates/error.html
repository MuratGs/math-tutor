<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>MathLearn — ошибка</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar bg-white border-bottom">
  <div class="container">
    <span class="navbar-brand">MathLearn</span>
    <div>
      <a href="/learn" class="btn btn-outline-secondary me-2">Обучение</a>
      <a href="/profile" class="btn btn-outline-secondary me-2">Профиль</a>
      <a href="/logout" class="btn btn-outline-secondary">Выйти</a>
    </div>
  </div>
</nav>

<main class="container mt-5" style="max-width: 720px;">
  <div class="alert alert-danger">
    <div class="fw-semibold mb-2">Произошла ошибка</div>
    <div th:text="${error != null ? error : 'Неизвестная ошибка'}"></div>
  </div>

  <div class="d-grid gap-2">
    <a href="/learn" class="btn btn-primary">Попробовать снова</a>
    <a href="/" class="btn btn-outline-secondary">На главную</a>
  </div>
</main>
</body>
</html>
